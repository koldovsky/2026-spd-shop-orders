spring.application.name=shop-orders
server.port=8081

# Local default: in-memory H2 in PostgreSQL mode, so the service runs without Docker.
spring.datasource.url=jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

shop.pricing.base-url=${PRICING_BASE_URL:http://localhost:8082}
